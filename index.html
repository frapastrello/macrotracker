<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Macro Tracker</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
:root {
  --bg:#ffffff;--bg2:#f5f5f4;--bg3:#eeece8;
  --text:#1a1a1a;--text2:#6b6b6b;--text3:#9a9a9a;
  --border:rgba(0,0,0,0.12);--border2:rgba(0,0,0,0.22);
  --radius:8px;--radius-lg:12px;
  --purple:#3C3489;--purple-light:#EEEDFE;--purple-mid:#AFA9EC;
  --blue:#185FA5;--blue-light:#E6F1FB;
  --green:#3B6D11;--green-light:#EAF3DE;
  --amber:#854F0B;--amber-light:#FAEEDA;
  --red:#A32D2D;--red-light:#FCEBEB;
  --teal:#0F6E56;--teal-light:#E1F5EE;
}
@media(prefers-color-scheme:dark){
  :root{--bg:#1c1c1c;--bg2:#262626;--bg3:#2e2e2e;--text:#f0f0f0;--text2:#a0a0a0;--text3:#6a6a6a;--border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.2);--purple-light:#26215C;--blue-light:#042C53;--green-light:#173404;--amber-light:#412402;--red-light:#501313;--teal-light:#04342C;}
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg3);color:var(--text);min-height:100vh;}
.app{max-width:740px;margin:0 auto;padding:0 0 60px;}
.top-nav{background:var(--bg);border-bottom:0.5px solid var(--border);padding:0 16px;display:flex;align-items:center;position:sticky;top:0;z-index:200;}
.logo{font-size:15px;font-weight:700;color:var(--purple);padding:14px 0;margin-right:16px;white-space:nowrap;}
.logo span{color:var(--text3);font-weight:400;}
.nav-links{display:flex;gap:0;flex:1;overflow-x:auto;}
.nav-links button{font-size:12px;padding:14px 10px;border:none;background:none;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-0.5px;white-space:nowrap;display:flex;align-items:center;gap:4px;font-family:inherit;}
.nav-links button:hover{color:var(--text);}
.nav-links button.a{color:var(--purple);border-bottom-color:var(--purple);font-weight:600;}
.profile-btn{width:32px;height:32px;border-radius:50%;background:var(--purple-light);border:0.5px solid var(--purple-mid);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;font-weight:700;color:var(--purple);margin-left:8px;flex-shrink:0;}
.page{display:none;padding:16px;}
.page.active{display:block;}
.card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px;margin-bottom:12px;}
.card-title{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;}
.metric{background:var(--bg2);border-radius:var(--radius);padding:10px;text-align:center;}
.metric .v{font-size:20px;font-weight:700;}
.metric .l{font-size:11px;color:var(--text3);margin-top:2px;}
input[type=number],input[type=text],input[type=search],select{width:100%;padding:8px 12px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-size:14px;font-family:inherit;outline:none;}
input:focus,select:focus{box-shadow:0 0 0 3px rgba(60,52,137,0.15);border-color:var(--purple);}
label{display:block;font-size:12px;color:var(--text2);margin-bottom:4px;font-weight:600;}
.field{margin-bottom:12px;}
.btn{padding:8px 16px;border-radius:var(--radius);border:0.5px solid var(--border2);background:var(--bg);color:var(--text);font-size:13px;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px;transition:background .15s;}
.btn:hover{background:var(--bg2);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-primary{background:var(--purple);color:#fff;border-color:var(--purple);font-weight:600;}
.btn-primary:hover{background:#2e2875;}
.btn-danger{color:var(--red);border-color:#E24B4A;}
.btn-danger:hover{background:var(--red-light);}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn-icon{width:30px;height:30px;padding:0;justify-content:center;}
.pill{display:inline-block;font-size:10px;padding:2px 7px;border-radius:8px;font-weight:700;margin-right:3px;}
.pp{background:var(--blue-light);color:var(--blue);}
.pc{background:var(--green-light);color:var(--green);}
.pf{background:var(--amber-light);color:var(--amber);}
.pk{background:var(--purple-light);color:var(--purple);}
.bar-bg{height:7px;background:var(--bg2);border-radius:4px;overflow:hidden;margin-top:4px;}
.bar-fill{height:100%;border-radius:4px;transition:width .4s;}
.macro-item{margin-bottom:9px;}
.macro-item .row{display:flex;justify-content:space-between;font-size:13px;}
.macro-item .row .name{color:var(--text2);}
.macro-item .row .val{font-weight:600;}
.info-box{background:var(--purple-light);border:0.5px solid var(--purple-mid);border-radius:var(--radius);padding:10px 14px;font-size:13px;color:var(--purple);margin-bottom:12px;display:flex;gap:8px;align-items:flex-start;}
.empty{text-align:center;padding:28px 0;color:var(--text3);font-size:13px;}
.empty i{font-size:28px;display:block;margin-bottom:8px;}
.over{color:var(--red)!important;}

/* PROFILES */
.profile-item{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:12px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;margin-bottom:8px;transition:border-color .15s;}
.profile-item:hover{border-color:var(--purple-mid);}
.profile-item.active-profile{border:2px solid var(--purple);background:var(--purple-light);}
.profile-avatar{width:40px;height:40px;border-radius:50%;background:var(--purple-light);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.profile-item.active-profile .profile-avatar{background:var(--purple);}
.profile-info{flex:1;}
.profile-name{font-weight:700;font-size:14px;}
.profile-sub{font-size:12px;color:var(--text2);margin-top:2px;}
.profile-badge{font-size:10px;background:var(--purple);color:#fff;padding:2px 8px;border-radius:10px;font-weight:700;}

/* CALENDAR */
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.cal-month{font-size:16px;font-weight:700;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:12px;}
.cal-day-name{text-align:center;font-size:10px;font-weight:700;color:var(--text3);padding:4px 0;text-transform:uppercase;}
.cal-day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:var(--radius);cursor:pointer;font-size:12px;border:0.5px solid transparent;transition:all .15s;position:relative;}
.cal-day:hover{background:var(--bg2);}
.cal-day.today{background:var(--purple-light);color:var(--purple);font-weight:700;}
.cal-day.selected{background:var(--purple);color:#fff;font-weight:700;}
.cal-day.has-data::after{content:'';width:4px;height:4px;border-radius:50%;background:var(--green);position:absolute;bottom:3px;}
.cal-day.selected.has-data::after{background:#fff;}
.cal-day.other-month{color:var(--text3);opacity:.4;}

/* LOGGER */
.meal-section-header{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:0.5px solid var(--border);margin-bottom:8px;}
.meal-section-title{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;}
.meal-section-kcal{font-size:12px;color:var(--text3);}
.food-entry{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:0.5px solid var(--border);}
.food-entry:last-child{border-bottom:none;}
.food-entry .fn{font-size:13px;font-weight:600;}
.food-entry .fd{font-size:11px;color:var(--text3);margin-top:2px;}

/* SEARCH */
.add-panel{background:var(--bg2);border-radius:var(--radius-lg);padding:14px;margin-bottom:14px;}
.search-wrap{position:relative;}
.search-results{background:var(--bg);border:0.5px solid var(--border2);border-radius:var(--radius);margin-top:4px;max-height:240px;overflow-y:auto;display:none;z-index:100;position:relative;}
.search-result-item{padding:
